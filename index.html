<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="foco-pomodorologo.png">
    <title>Timer</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: rgba(255, 255, 255, 0.06);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --accent-color: #f28b8b;
            --accent-light: #fbd0d0;
            --accent-dark: #bd5555;
            --btn-start-bg: #ffffff;
            --btn-start-text: #1a1a1a;
            --bg-grad-1: #2c252d;
            --bg-grad-2: #121013;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top, var(--bg-grad-1) 0%, var(--bg-grad-2) 100%);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            transition: background 0.8s ease;
            animation: page-enter 0.7s ease both;
        }

        @keyframes page-enter {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes container-enter {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes panel-enter {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes panel-exit {
            from {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            to {
                opacity: 0;
                transform: translateY(-8px) scale(0.96);
            }
        }

        @keyframes tab-enter {
            from {
                opacity: 0;
                transform: translateX(32px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes todo-add {
            from {
                opacity: 0;
                max-height: 0;
                margin-bottom: 0;
                padding-top: 0;
                padding-bottom: 0;
                transform: translateY(-12px) scale(0.96);
            }

            to {
                opacity: 1;
                max-height: 500px;
                margin-bottom: 10px;
                padding-top: 14px;
                padding-bottom: 14px;
                transform: translateY(0) scale(1);
            }
        }

        .outer-wrapper {
            position: relative;
            width: 92%;
            max-width: 480px;
        }

        .settings-bar {
            position: absolute;
            top: -50px;
            right: 0;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
        }

        .palette-wrapper {
            position: relative;
        }

        .palette-trigger {
            width: 48px;
            height: 48px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.35);
            background-image: url("palhetadecores.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            cursor: pointer;
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease;
        }

        .palette-trigger:hover {
            transform: translateY(-1px) scale(1.04);
        }

        .color-panel {
            position: absolute;
            top: 54px;
            right: 0;
            width: 220px;
            background: rgba(15, 15, 15, 0.9);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 14px;
            box-sizing: border-box;
        }

        .color-panel.is-open {
            animation: panel-enter 0.2s ease both;
            transform-origin: top right;
        }

        .color-panel.is-closing {
            animation: panel-exit 0.18s ease both;
            transform-origin: top right;
        }

        .color-wheel-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .color-wheel {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: conic-gradient(red 0deg,
                    #ff0 60deg,
                    lime 120deg,
                    cyan 180deg,
                    blue 240deg,
                    magenta 300deg,
                    red 360deg);
            box-shadow: inset 0 0 0 4px rgba(255, 255, 255, 0.12), 0 10px 22px rgba(0, 0, 0, 0.28);
            position: relative;
            cursor: crosshair;
            user-select: none;
        }

        .color-wheel::before {
            content: "";
            position: absolute;
            inset: 18px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, rgba(255, 255, 255, 0.18) 32%, rgba(0, 0, 0, 0.12) 82%);
            box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.15);
        }

        .color-wheel-dot {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: #ff6b6b;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.25);
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        .container {
            width: 100%;
            padding: 35px 25px;
            box-sizing: border-box;
            background: var(--card-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: container-enter 0.7s 0.08s ease both;
        }

        .tabs {
            display: flex;
            width: 100%;
            justify-content: space-between;
            margin-bottom: 35px;
            background: rgba(0, 0, 0, 0.2);
            padding: 6px;
            border-radius: 14px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .tab-indicator {
            position: absolute;
            top: 6px;
            left: 0;
            height: calc(100% - 12px);
            border-radius: 10px;
            background: var(--accent-color);
            pointer-events: none;
            z-index: 0;
            transition: transform 0.65s cubic-bezier(0.22, 0.61, 0.36, 1),
                background-color 0.3s ease;
            will-change: transform;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            padding: 10px 5px;
            border-radius: 10px;
            text-align: center;
            transition: all 0.2s ease;
            position: relative;
            z-index: 1;
        }

        .tab-btn {
            animation: page-enter 0.5s ease both;
        }

        .tab-btn:nth-child(2) {
            animation-delay: 0.08s;
        }

        .tab-btn:nth-child(3) {
            animation-delay: 0.16s;
        }

        .tab-btn:nth-child(4) {
            animation-delay: 0.24s;
        }

        #tab-t {
            color: rgba(255, 255, 255, 0.7);
        }

        #tab-t.active {
            color: #ffffff;
        }

        .tab-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.04);
        }

        .tab-btn.active {
            color: #ffffff;
            background: transparent;
            font-weight: 600;
        }

        .display-container {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 30px;
        }

        .display {
            font-size: 82px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .display small {
            font-size: 46px;
            font-weight: 300;
            opacity: 0.6;
            margin-left: 2px;
        }

        .inputs-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            height: 140px;
            width: 100%;
            margin-bottom: 30px;
        }

        .inputs-container input {
            width: 75px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: var(--accent-dark);
            font-size: 46px;
            font-weight: 600;
            text-align: center;
            padding: 8px 0;
            font-variant-numeric: tabular-nums;
            transition: all 0.2s ease;
        }

        .inputs-container input::placeholder {
            color: var(--accent-dark);
            opacity: 1;
        }

        .inputs-container input:focus {
            outline: none;
            border-color: var(--accent-color);
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff;
        }

        .inputs-container input.number-selected {
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
        }

        .inputs-container input.number-has-value {
            color: #ffffff;
            -webkit-text-fill-color: #ffffff;
        }

        .inputs-container input.number-selected::placeholder {
            color: #ffffff;
            opacity: 1;
        }

        .inputs-container input::selection {
            background: var(--accent-color);
            color: #ffffff !important;
        }

        .inputs-container label {
            font-size: 15px;
            color: var(--text-secondary);
            margin-right: 8px;
            font-weight: 500;
        }

        .controls {
            display: flex;
            width: 100%;
            justify-content: center;
            gap: 15px;
        }

        .btn-focus {
            padding: 18px 35px;
            border-radius: 16px;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-focus:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn-focus,
        .btn-add,
        .todo-item,
        .editor-toolbar,
        .notes-editor {
            animation: page-enter 0.45s ease both;
        }

        .btn-focus:active {
            transform: translateY(0px);
        }

        .btn-start {
            background: var(--accent-light);
            color: #1a1a1a;
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.05);
        }

        .btn-pause {
            background: var(--accent-color);
            color: #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-reset {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid var(--card-border);
        }

        .btn-stop-alarm {
            width: 100%;
            background: #ef4444;
            color: white;
            padding: 18px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .hidden {
            display: none !important;
        }

        .tab-stage {
            position: relative;
            width: 100%;
            overflow: hidden;
            transition: height 0.38s ease;
        }

        .tab-slide-layer {
            position: absolute !important;
            top: 0;
            left: 0;
            width: 100% !important;
        }

        .scroll-box {
            width: 100%;
            max-height: 180px;
            overflow-y: auto;
            margin-top: 25px;
            padding-right: 5px;
        }

        .scroll-box::-webkit-scrollbar {
            width: 4px;
        }

        .scroll-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 15px;
            color: var(--text-secondary);
        }

        .lap-item span:last-child {
            color: var(--text-color);
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .todo-heading {
            margin: 0 0 16px;
            color: var(--text-color);
            font-size: 22px;
            font-weight: 700;
            text-align: left;
            caret-color: #ffffff;
        }

        #todo-sec .input-group input {
            background: rgba(0, 0, 0, 0.32);
            border: 2px solid color-mix(in srgb, var(--accent-color) 42%, transparent);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.12);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
        }

        #todo-sec .input-group input::placeholder {
            color: var(--accent-color);
            opacity: 0.85;
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .input-group input {
            flex: 1;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            color: #fff;
            padding: 14px 16px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn-add {
            background: var(--accent-color);
            background: var(--accent-light);
            color: #000;
            font-weight: 700;
            padding: 0 20px;
            border-radius: 14px;
            border: none;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .todo-item {
            display: flex;
            width: 100%;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            padding: 14px 16px;
            border-radius: 14px;
            margin-bottom: 10px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-sizing: border-box;
            gap: 12px;
        }

        .todo-item.todo-adding {
            animation: todo-add 0.35s ease both;
            overflow: hidden;
        }

        .todo-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }

        .todo-left input {
            width: 16px;
            height: 16px;
            accent-color: var(--accent-color);
            cursor: pointer;
            flex-shrink: 0;
        }

        .todo-main {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
            flex: 1;
        }

        .todo-text {
            word-break: break-word;
        }

        .todo-timer {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .todo-item.done .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .todo-timer-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-del {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        /* Estilos do Editor Word */
        .editor-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 12px 12px 0 0;
            border: 1px solid var(--card-border);
            width: 100%;
            box-sizing: border-box;
        }

        .editor-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .editor-btn:hover {
            background: var(--accent-color);
            color: #fff;
        }

        .notes-editor {
            width: 100%;
            height: 180px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-top: none;
            border-radius: 0 0 16px 16px;
            color: #fff;
            padding: 16px;
            box-sizing: border-box;
            overflow-y: auto;
            font-size: 15px;
            line-height: 1.6;
            text-align: left;
        }

        .notes-editor.is-empty::before {
            content: "Escreva o que quiser com formatação automática";
            color: var(--text-secondary);
            pointer-events: none;
            transition: opacity 0.15s ease;
        }

        .notes-editor.is-empty:focus::before {
            display: none;
        }

        .notes-editor:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .notes-editor ul,
        .notes-editor ol {
            padding-left: 20px;
            margin: 5px 0;
        }

        .save-status {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 8px;
            font-style: italic;
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
    <div class="outer-wrapper">
        <div class="settings-bar">
            <div class="palette-wrapper">
                <button class="palette-trigger" id="paletteTrigger" aria-label="Abrir paleta de cores"></button>
                <div class="color-panel hidden" id="colorPanel">
                    <div class="color-wheel-wrap">
                        <div class="color-wheel" id="colorWheel" aria-label="Roda de cores">
                            <div class="color-wheel-dot" id="colorWheelDot"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="tabs">
                <div class="tab-indicator" id="tabIndicator" aria-hidden="true"></div>
                <button class="tab-btn active" id="tab-c" onclick="swTab('cronometro')">Cronômetro</button>
                <button class="tab-btn" id="tab-t" onclick="swTab('timer')">Temporizador</button>
                <button class="tab-btn" id="tab-todo" onclick="swTab('todo')">Tarefas</button>
                <button class="tab-btn" id="tab-notes" onclick="swTab('notes')">Notas</button>
            </div>

            <div class="tab-stage" id="tabStage">
                <!-- SEÇÃO CRONÔMETRO -->
                <div id="c-sec" class="tab-section" style="width: 100%; text-align: center;">
                    <div class="display-container">
                        <div class="display" id="c-display">00:00<small>.00</small></div>
                    </div>
                    <div class="controls">
                        <button class="btn-focus btn-reset" id="c-lap-btn" onclick="recordLap()">Volta</button>
                        <button class="btn-focus btn-start" id="c-start" onclick="startC()">Iniciar</button>
                        <button class="btn-focus btn-pause hidden" id="c-pause" onclick="pauseC()">Pausar</button>
                    </div>
                    <div class="scroll-box" id="lapsContainer"></div>
                </div>

                <!-- SEÇÃO TEMPORIZADOR -->
                <div id="t-sec" class="tab-section hidden" style="width: 100%; text-align: center;">
                    <div class="inputs-container" id="t-inputs">
                        <input type="number" id="t-hr" min="0" placeholder="00"
                            oninput="limitL(this); updateTimerNumberColor(this)"
                            onfocus="this.classList.add('number-selected')"
                            onblur="this.classList.remove('number-selected')"><label>h</label>
                        <input type="number" id="t-min" min="0" placeholder="00"
                            oninput="limitL(this); updateTimerNumberColor(this)"
                            onfocus="this.classList.add('number-selected')"
                            onblur="this.classList.remove('number-selected')"><label>m</label>
                        <input type="number" id="t-seg" min="0" placeholder="00"
                            oninput="limitL(this); updateTimerNumberColor(this)"
                            onfocus="this.classList.add('number-selected')"
                            onblur="this.classList.remove('number-selected')"><label>s</label>
                    </div>
                    <div class="display-container hidden" id="t-disp-box">
                        <div class="display" id="t-display">00:05:00</div>
                    </div>
                    <button class="btn-stop-alarm hidden" id="stopAlarmBtn" onclick="stopAlarm()">Parar Alarme</button>
                    <div class="controls" id="t-controls-div">
                        <button class="btn-focus btn-reset" onclick="resetT()">Cancelar</button>
                        <button class="btn-focus btn-start" id="t-start" onclick="startT()">Iniciar</button>
                        <button class="btn-focus btn-pause hidden" id="t-pause" onclick="pauseT()">Pausar</button>
                    </div>
                </div>

                <!-- SEÇÃO TAREFAS -->
                <div id="todo-sec" class="tab-section hidden" style="width: 100%;">
                    <h2 class="todo-heading">Lista de tarefas</h2>
                    <div class="input-group">
                        <input type="text" id="todoInput" placeholder="O que vamos fazer agora?">
                        <button class="btn-add" onclick="addTodo()">+</button>
                    </div>
                    <div class="scroll-box" id="todoContainer"></div>
                </div>

                <!-- SEÇÃO NOTAS ESTILO WORD -->
                <div id="notes-sec" class="tab-section hidden" style="width: 100%;">
                    <div class="editor-toolbar">
                        <button class="editor-btn" onclick="execCmd('bold')">B</button>
                        <button class="editor-btn" onclick="execCmd('italic')"><i>I</i></button>
                        <button class="editor-btn" onclick="execCmd('underline')"><u>U</u></button>
                        <button class="editor-btn" type="button" onmousedown="event.preventDefault()"
                            onclick="deletePreviousCharacter()" title="Apagar caractere anterior"
                            aria-label="Apagar caractere anterior">⬅</button>
                        <button class="editor-btn" onclick="execCmd('justifyCenter')">Direct</button>
                        <button class="editor-btn" onclick="execCmd('insertUnorderedList')">• Lista</button>
                        <button class="editor-btn" type="button" onmousedown="event.preventDefault()"
                            onclick="clearNotes()" title="Limpar Tudo" aria-label="Limpar Tudo">Limpar Tudo</button>
                    </div>
                    <div class="notes-editor is-empty" id="notesInput" contenteditable="true"
                        onmousedown="keepEmptyCaretAtStart(event, this)" onfocus="placeCaretAtStart(this)"
                        onclick="setTimeout(() => placeCaretAtStart(this), 0)"
                        onmouseup="setTimeout(() => placeCaretAtStart(this), 0)" oninput="saveNotes()"
                        onkeydown="autoFormatTyping(event)" onpaste="autoFormatPaste(event)"></div>
                    <div class="save-status" id="saveStatus">Salvo automaticamente no navegador</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        let wakeLock = null;
        async function reqLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { } }
        function relLock() { if (wakeLock !== null) { wakeLock.release(); wakeLock = null; } }

        // Função do Editor do Word para rodar comandos nativos de texto
        function execCmd(cmd) {
            document.execCommand(cmd, false, null);
            document.getElementById('notesInput').focus();
        }

        function hexToRgb(hex) {
            const clean = hex.replace('#', '');
            const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
            const num = parseInt(full, 16);
            return {
                r: (num >> 16) & 255,
                g: (num >> 8) & 255,
                b: num & 255
            };
        }

        function rgbToHex(r, g, b) {
            const toHex = (value) => value.toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
        }

        function hslToHex(h, s, l) {
            const pastelS = Math.min(80, Math.max(45, s));
            const pastelL = Math.min(82, Math.max(68, l));
            let sat = pastelS / 100;
            let light = pastelL / 100;
            const c = (1 - Math.abs(2 * light - 1)) * sat;
            const x = c * (1 - Math.abs((h / 60) % 2 - 1));
            const m = light - c / 2;
            let r = 0, g = 0, b = 0;

            if (h >= 0 && h < 60) [r, g, b] = [c, x, 0];
            else if (h < 120) [r, g, b] = [x, c, 0];
            else if (h < 180) [r, g, b] = [0, c, x];
            else if (h < 240) [r, g, b] = [0, x, c];
            else if (h < 300) [r, g, b] = [x, 0, c];
            else[r, g, b] = [c, 0, x];

            const toHex = (value) => Math.round((value + m) * 255).toString(16).padStart(2, '0');
            return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
        }

        function shadeColor(hex, percent) {
            const { r, g, b } = hexToRgb(hex);
            const adjust = (channel) => Math.min(255, Math.max(0, channel + Math.round((255 * percent) / 100)));
            return rgbToHex(adjust(r), adjust(g), adjust(b));
        }

        function changeColor(hex) {
            const grad1 = shadeColor(hex, -15);
            const grad2 = shadeColor(hex, -30);
            document.documentElement.style.setProperty('--accent-color', hex);
            document.documentElement.style.setProperty('--accent-light', `color-mix(in srgb, ${hex} 35%, white)`);
            document.documentElement.style.setProperty('--accent-dark', shadeColor(hex, -38));
            document.documentElement.style.setProperty('--bg-grad-1', grad1);
            document.documentElement.style.setProperty('--bg-grad-2', grad2);

            const activeTab = document.querySelector('.tab-btn.active');
            if (activeTab) moveTabIndicator(activeTab, hex);
        }

        function moveTabIndicator(button, color = '') {
            const indicator = document.getElementById('tabIndicator');
            if (!indicator || !button) return;
            indicator.style.width = `${button.offsetWidth}px`;
            indicator.style.transform = `translateX(${button.offsetLeft}px)`;
            if (color) indicator.style.backgroundColor = color;
        }

        function setWheelColorFromPoint(x, y) {
            const rect = document.getElementById('colorWheel').getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const dx = x - cx;
            const dy = y - cy;
            const distance = Math.min(Math.hypot(dx, dy), rect.width / 2);
            const angle = (Math.atan2(dy, dx) * 180 / Math.PI + 90 + 360) % 360;
            const hue = angle;
            const saturation = Math.min(80, 50 + (distance / (rect.width / 2)) * 30);
            const color = hslToHex(hue, saturation, 76);
            const dot = document.getElementById('colorWheelDot');

            const angleRad = ((hue - 90) * Math.PI) / 180;
            const offset = distance;
            const dotX = Math.cos(angleRad) * offset;
            const dotY = Math.sin(angleRad) * offset;

            dot.style.left = `calc(50% + ${dotX}px)`;
            dot.style.top = `calc(50% + ${dotY}px)`;
            dot.style.background = color;
            changeColor(color);
        }

        const paletteTrigger = document.getElementById('paletteTrigger');
        const colorPanel = document.getElementById('colorPanel');
        const colorWheel = document.getElementById('colorWheel');
        let draggingWheel = false;
        let colorPanelCloseTimer = null;

        function openColorPanel() {
            clearTimeout(colorPanelCloseTimer);
            colorPanel.classList.remove('hidden', 'is-closing');
            colorPanel.classList.add('is-open');
        }

        function closeColorPanel() {
            if (colorPanel.classList.contains('hidden') || colorPanel.classList.contains('is-closing')) return;
            colorPanel.classList.remove('is-open');
            colorPanel.classList.add('is-closing');
            colorPanelCloseTimer = setTimeout(() => {
                colorPanel.classList.remove('is-closing');
                colorPanel.classList.add('hidden');
            }, 180);
        }

        paletteTrigger.addEventListener('click', () => {
            if (colorPanel.classList.contains('is-open')) closeColorPanel();
            else openColorPanel();
        });

        document.addEventListener('click', (event) => {
            if (!event.target.closest('.palette-wrapper')) {
                closeColorPanel();
            }
        });

        colorWheel.addEventListener('pointerdown', (event) => {
            draggingWheel = true;
            colorWheel.setPointerCapture(event.pointerId);
            setWheelColorFromPoint(event.clientX, event.clientY);
        });

        colorWheel.addEventListener('pointermove', (event) => {
            if (draggingWheel) {
                setWheelColorFromPoint(event.clientX, event.clientY);
            }
        });

        colorWheel.addEventListener('pointerup', () => {
            draggingWheel = false;
        });

        colorWheel.addEventListener('pointerleave', () => {
            draggingWheel = false;
        });

        const defaultColor = '#F28B8B';
        setWheelColorFromPoint(
            colorWheel.getBoundingClientRect().left + colorWheel.offsetWidth * 0.5,
            colorWheel.getBoundingClientRect().top + 25
        );
        changeColor(defaultColor);

        let tabTransitionId = 0;
        let activeTabAnimations = [];

        function swTab(tab) {
            const tabIds = {
                cronometro: 'c',
                timer: 't',
                todo: 'todo',
                notes: 'notes'
            };
            const tabs = Object.values(tabIds);
            const currentTab = tabIds[tab];
            const stage = document.getElementById('tabStage');
            const currentSection = document.getElementById(`${currentTab}-sec`);
            const currentIndex = tabs.indexOf(currentTab);
            const previousSection = tabs
                .map(item => document.getElementById(`${item}-sec`))
                .find(section => !section.classList.contains('hidden'));
            const previousIndex = previousSection ? tabs.indexOf(previousSection.id.replace('-sec', '')) : currentIndex;

            if (!currentTab || previousSection === currentSection) return;

            activeTabAnimations.forEach(animation => animation.cancel());
            activeTabAnimations = [];

            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                btn.classList.remove('active');
            });
            const currentBtn = document.getElementById(`tab-${currentTab}`);
            currentBtn.classList.add('active');
            const hex = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
            moveTabIndicator(currentBtn, hex);
            tabs
                .map(item => document.getElementById(`${item}-sec`))
                .filter(section => section !== previousSection && section !== currentSection)
                .forEach(section => section.classList.add('hidden'));

            currentSection.classList.remove('hidden');
            const transitionId = ++tabTransitionId;
            const movingForward = currentIndex > previousIndex;
            const enterFrom = movingForward ? '32px' : '-32px';
            const leaveTo = movingForward ? '-32px' : '32px';
            if (!previousSection) {
                currentSection.animate([
                    { opacity: 0, transform: `translateX(${enterFrom})` },
                    { opacity: 1, transform: 'translateX(0)' }
                ], { duration: 380, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
                return;
            }

            const startHeight = previousSection.offsetHeight;
            const targetHeight = currentSection.offsetHeight;
            stage.style.height = `${startHeight}px`;
            void stage.offsetHeight;
            requestAnimationFrame(() => {
                if (transitionId === tabTransitionId) stage.style.height = `${targetHeight}px`;
            });
            previousSection.classList.add('tab-slide-layer');
            currentSection.classList.add('tab-slide-layer');

            const leaving = previousSection.animate([
                { opacity: 1, transform: 'translateX(0)' },
                { opacity: 0, transform: `translateX(${leaveTo})` }
            ], { duration: 380, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
            const entering = currentSection.animate([
                { opacity: 0, transform: `translateX(${enterFrom})` },
                { opacity: 1, transform: 'translateX(0)' }
            ], { duration: 380, easing: 'cubic-bezier(0.22, 0.61, 0.36, 1)' });
            activeTabAnimations = [leaving, entering];

            Promise.all([leaving.finished, entering.finished]).then(() => {
                if (transitionId !== tabTransitionId) return;
                previousSection.classList.add('hidden');
                previousSection.classList.remove('tab-slide-layer');
                currentSection.classList.remove('tab-slide-layer');
                stage.style.height = `${targetHeight}px`;
                activeTabAnimations = [];
                setTimeout(() => {
                    if (transitionId === tabTransitionId) stage.style.height = '';
                }, 400);
            }).catch(() => { });
        }

        function limitL(el) { if (el.value.length > 2) el.value = el.value.slice(0, 2); }

        function updateTimerNumberColor(input) {
            input.classList.toggle('number-has-value', input.value !== '' && Number(input.value) !== 0);
        }

        let cStart = 0, cTime = 0, cInt, lapN = 0;
        function startC() {
            cStart = Date.now() - cTime;
            cInt = setInterval(upC, 10);
            document.getElementById('c-start').classList.add('hidden');
            document.getElementById('c-pause').classList.remove('hidden');
            document.getElementById('c-lap-btn').textContent = "Volta";
            reqLock();
        }
        function pauseC() {
            clearInterval(cInt);
            cTime = Date.now() - cStart;
            document.getElementById('c-start').classList.remove('hidden');
            document.getElementById('c-pause').classList.add('hidden');
            document.getElementById('c-lap-btn').textContent = "Zerar";
            relLock();
        }
        function upC() {
            cTime = Date.now() - cStart;
            let m = Math.floor((cTime % 3600000) / 60000);
            let s = Math.floor((cTime % 60000) / 1000);
            let ms = Math.floor((cTime % 1000) / 10);
            document.getElementById('c-display').innerHTML = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}<small>.${String(ms).padStart(2, '0')}</small>`;
        }
        function recordLap() {
            if (document.getElementById('c-lap-btn').textContent === "Zerar") {
                clearInterval(cInt); cStart = 0; cTime = 0; lapN = 0;
                document.getElementById('c-display').innerHTML = "00:00<small>.00</small>";
                document.getElementById('lapsContainer').innerHTML = "";
                document.getElementById('c-lap-btn').textContent = "Volta";
                return;
            }
            if (cTime === 0) return;
            lapN++;
            const i = document.createElement('div');
            i.className = 'lap-item';
            i.innerHTML = `<span>Volta ${lapN}</span><span>${document.getElementById('c-display').textContent}</span>`;
            document.getElementById('lapsContainer').prepend(i);
        }

        let tDur = 0, tInt, tTarget, aInt = null;
        function startT() {
            if (!tInt && tDur === 0) {
                let h = parseInt(document.getElementById('t-hr').value) || 0;
                let m = parseInt(document.getElementById('t-min').value) || 0;
                let s = parseInt(document.getElementById('t-seg').value) || 0;
                if (s >= 60) { m += Math.floor(s / 60); s = s % 60; }
                if (m >= 60) { h += Math.floor(m / 60); m = m % 60; }
                document.getElementById('t-hr').value = h > 0 ? String(h).padStart(2, '0') : "";
                document.getElementById('t-min').value = String(m).padStart(2, '0');
                document.getElementById('t-seg').value = String(s).padStart(2, '0');
                updateTimerNumberColor(document.getElementById('t-hr'));
                updateTimerNumberColor(document.getElementById('t-min'));
                updateTimerNumberColor(document.getElementById('t-seg'));
                tDur = (h * 3600 + m * 60 + s) * 1000;
            }
            if (tDur <= 0) return;
            document.getElementById('t-inputs').classList.add('hidden');
            document.getElementById('t-disp-box').classList.remove('hidden');
            upTDisp(tDur);
            tTarget = Date.now() + tDur;
            tInt = setInterval(() => {
                tDur = tTarget - Date.now();
                if (tDur <= 0) { clearInterval(tInt); tInt = null; tDur = 0; playA(); }
                else { upTDisp(tDur); }
            }, 100);
            document.getElementById('t-start').classList.add('hidden');
            document.getElementById('t-pause').classList.remove('hidden');
            reqLock();
        }
        function pauseT() { clearInterval(tInt); tInt = null; document.getElementById('t-start').classList.remove('hidden'); document.getElementById('t-pause').classList.add('hidden'); relLock(); }
        function resetT() {
            clearInterval(tInt);
            tInt = null;
            tDur = 0;
            document.getElementById('t-inputs').classList.remove('hidden');
            document.getElementById('t-disp-box').classList.add('hidden');
            document.getElementById('t-start').classList.remove('hidden');
            document.getElementById('t-pause').classList.add('hidden');
            stopAlarm(false);
            relLock();
        }
        function upTDisp(ms) { let h = Math.floor(ms / 3600000); let m = Math.floor((ms % 3600000) / 60000); let s = Math.floor((ms % 60000) / 1000); document.getElementById('t-display').textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`; }

        function playA() {
            document.getElementById('t-controls-div').classList.add('hidden');
            document.getElementById('stopAlarmBtn').classList.remove('hidden');
            const aCtx = new (window.AudioContext || window.webkitAudioContext)();
            aInt = setInterval(() => {
                const o = aCtx.createOscillator(); const g = aCtx.createGain();
                o.connect(g); g.connect(aCtx.destination);
                o.frequency.setValueAtTime(880, aCtx.currentTime);
                g.gain.setValueAtTime(0.4, aCtx.currentTime);
                o.start(); o.stop(aCtx.currentTime + 0.3);
            }, 600);
        }
        function stopAlarm(resetTimer = true) {
            if (aInt) { clearInterval(aInt); aInt = null; }
            document.getElementById('t-controls-div').classList.remove('hidden');
            document.getElementById('stopAlarmBtn').classList.add('hidden');
            if (resetTimer) resetT();
        }

        let todoTasks = [];
        let todoTimerInterval = null;

        function formatDuration(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            if (hours > 0) return `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function saveTodoTasks() {
            localStorage.setItem('focus_todo_tasks', JSON.stringify(todoTasks));
        }

        function toggleTaskTimer(taskId) {
            const task = todoTasks.find(item => item.id === taskId);
            if (!task) return;

            if (task.running) {
                task.elapsedMs += Date.now() - task.startedAt;
                task.running = false;
                task.startedAt = null;
            } else {
                task.running = true;
                task.startedAt = Date.now();
            }

            saveTodoTasks();
            renderTodoTasks();
        }

        function toggleTodo(taskId, checked) {
            const task = todoTasks.find(item => item.id === taskId);
            if (!task) return;
            task.done = checked;
            saveTodoTasks();
            renderTodoTasks();
        }

        function removeTodo(taskId) {
            const item = document.querySelector(`[data-task-id="${taskId}"]`);
            const finishRemoval = () => {
                todoTasks = todoTasks.filter(item => item.id !== taskId);
                saveTodoTasks();
                renderTodoTasks();
            };

            if (!item) {
                finishRemoval();
                return;
            }

            const height = item.getBoundingClientRect().height;
            item.style.overflow = 'hidden';
            item.style.pointerEvents = 'none';
            const removalAnimation = item.animate([
                {
                    height: `${height}px`,
                    opacity: 1,
                    marginBottom: '10px',
                    paddingTop: '14px',
                    paddingBottom: '14px',
                    transform: 'translateX(0) scale(1)'
                },
                {
                    height: '0px',
                    opacity: 0,
                    marginBottom: '0px',
                    paddingTop: '0px',
                    paddingBottom: '0px',
                    transform: 'translateX(12px) scale(0.98)'
                }
            ], {
                duration: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 420,
                easing: 'cubic-bezier(0.4, 0, 0.2, 1)',
                fill: 'forwards'
            });
            removalAnimation.onfinish = finishRemoval;
        }

        function addTodo() {
            const input = document.getElementById('todoInput');
            const value = input.value.trim();
            if (!value) return;

            const newTask = {
                id: Date.now() + Math.random(),
                text: value,
                done: false,
                elapsedMs: 0,
                running: false,
                startedAt: null
            };
            todoTasks.unshift(newTask);

            input.value = '';
            saveTodoTasks();
            renderTodoTasks(newTask.id);
        }

        function renderTodoTasks(animatedTaskId = null) {
            const container = document.getElementById('todoContainer');
            container.innerHTML = '';

            todoTasks.forEach(task => {
                const item = document.createElement('div');
                item.className = `todo-item ${task.done ? 'done' : ''} ${task.id === animatedTaskId ? 'todo-adding' : ''}`;
                item.dataset.taskId = task.id;
                item.innerHTML = `
                    <div class="todo-left">
                        <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTodo(${task.id}, this.checked)">
                        <div class="todo-main">
                            <span class="todo-text">${task.text}</span>
                            <span class="todo-timer">${formatDuration(task.elapsedMs + (task.running && task.startedAt ? Date.now() - task.startedAt : 0))}</span>
                        </div>
                    </div>
                    <div class="todo-actions">
                        <button class="todo-timer-btn" onclick="toggleTaskTimer(${task.id})">${task.running ? 'Pausar' : 'Iniciar'}</button>
                        <button class="btn-del" onclick="removeTodo(${task.id})">✕</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function startTodoTimerLoop() {
            if (todoTimerInterval) return;
            todoTimerInterval = setInterval(() => {
                const hasRunning = todoTasks.some(task => task.running);
                if (!hasRunning) return;
                renderTodoTasks();
            }, 1000);
        }

        function loadTodoTasks() {
            const saved = localStorage.getItem('focus_todo_tasks');
            todoTasks = saved ? JSON.parse(saved) : [];
            todoTasks = todoTasks.map(task => ({
                ...task,
                running: Boolean(task.running),
                startedAt: task.running && task.startedAt ? Number(task.startedAt) : null,
                elapsedMs: Number(task.elapsedMs || 0)
            }));
            renderTodoTasks();
            startTodoTimerLoop();
        }

        function escapeHtml(text) {
            const element = document.createElement('div');
            element.textContent = text;
            return element.innerHTML;
        }

        function autoFormatTyping(event) {
            if (event.key !== ' ') return;
            const selection = window.getSelection();
            if (!selection || !selection.isCollapsed || !selection.anchorNode || selection.anchorNode.nodeType !== Node.TEXT_NODE) return;

            const textBeforeCursor = selection.anchorNode.textContent.slice(0, selection.anchorOffset);
            const lineStart = textBeforeCursor.lastIndexOf('\n') + 1;
            const currentLine = textBeforeCursor.slice(lineStart);
            const marker = currentLine.match(/^(#|-|\*|\d+[.)]) $/);
            if (!marker) return;

            event.preventDefault();
            const markerLength = marker[0].length;
            const range = document.createRange();
            range.setStart(selection.anchorNode, selection.anchorOffset - markerLength);
            range.setEnd(selection.anchorNode, selection.anchorOffset);
            selection.removeAllRanges();
            selection.addRange(range);
            document.execCommand('delete');

            if (marker[1] === '#') {
                document.execCommand('formatBlock', false, 'h3');
            } else {
                document.execCommand(marker[1].match(/^\d/) ? 'insertOrderedList' : 'insertUnorderedList');
            }
            saveNotes();
        }

        function autoFormatPaste(event) {
            const text = event.clipboardData?.getData('text/plain');
            if (!text || !/^(\s*[-*]\s+|\s*\d+[.)]\s+)/m.test(text)) return;

            event.preventDefault();
            const lines = text.split(/\r?\n/);
            let html = '';
            let listType = null;

            const closeList = () => {
                if (listType) html += `</${listType}>`;
                listType = null;
            };

            lines.forEach(line => {
                const unordered = line.match(/^\s*[-*]\s+(.+)$/);
                const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
                if (unordered || ordered) {
                    const nextType = unordered ? 'ul' : 'ol';
                    if (listType !== nextType) {
                        closeList();
                        listType = nextType;
                        html += `<${listType}>`;
                    }
                    html += `<li>${escapeHtml((unordered || ordered)[1])}</li>`;
                    return;
                }

                closeList();
                if (line.trim()) html += `<p>${escapeHtml(line.trim())}</p>`;
            });

            closeList();
            document.execCommand('insertHTML', false, html);
            saveNotes();
        }

        function updateNotesPlaceholder() {
            const notes = document.getElementById('notesInput');
            notes.classList.toggle('is-empty', isNotesEmpty(notes));
        }

        function isNotesEmpty(editor) {
            return editor.innerHTML.replace(/<br\s*\/?>(\s*)/gi, '').replace(/&nbsp;/gi, '').trim() === '';
        }

        function placeCaretAtStart(editor) {
            if (!isNotesEmpty(editor)) return;
            editor.innerHTML = '';
            const selection = window.getSelection();
            const range = document.createRange();
            range.setStart(editor, 0);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
        }

        function keepEmptyCaretAtStart(event, editor) {
            if (!isNotesEmpty(editor)) return;
            event.preventDefault();
            editor.focus();
            setTimeout(() => placeCaretAtStart(editor), 0);
        }

        function saveNotes() {
            const notes = document.getElementById('notesInput');
            const htmlContent = notes.innerHTML;
            localStorage.setItem('chronos_notes_html', htmlContent);
            updateNotesPlaceholder();
        }

        function clearNotes() {
            const notes = document.getElementById('notesInput');
            notes.innerHTML = '';
            localStorage.removeItem('chronos_notes_html');
            updateNotesPlaceholder();
            notes.focus();
            placeCaretAtStart(notes);
        }

        function deletePreviousCharacter() {
            const notes = document.getElementById('notesInput');
            if (isNotesEmpty(notes)) {
                notes.innerHTML = '';
                notes.focus();
                placeCaretAtStart(notes);
                setTimeout(() => placeCaretAtStart(notes), 0);
                return;
            }

            const selection = window.getSelection();
            if (!selection || selection.rangeCount === 0) return;

            if (selection.isCollapsed && typeof selection.modify === 'function') {
                selection.modify('extend', 'backward', 'character');
            }

            if (!selection.isCollapsed) {
                document.execCommand('delete');
                saveNotes();
            }
        }

        window.onload = function () {
            const saved = localStorage.getItem('chronos_notes_html');
            if (saved) document.getElementById('notesInput').innerHTML = saved;
            updateNotesPlaceholder();

            loadTodoTasks();

            const hex = getComputedStyle(document.documentElement).getPropertyValue('--accent-color').trim();
            moveTabIndicator(document.getElementById('tab-c'), hex);
        }
    </script>
</body>
